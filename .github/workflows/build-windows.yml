name: Build and Release Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe (Edge WebView2)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview static-ffmpeg mutagen yt-dlp

      - name: Build Standalone Windows Executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed `
            --name "SoundCloud Downloader" `
            --add-data "static;static" `
            --icon "icon.ico" `
            app_windows.py

      - name: Bundle Static FFmpeg Executable
        shell: pwsh
        run: |
          python -c "import static_ffmpeg, shutil, os; f, p = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); dest = os.path.join('dist', 'SoundCloud Downloader'); shutil.copy(f, os.path.join(dest, 'ffmpeg.exe')); shutil.copy(p, os.path.join(dest, 'ffprobe.exe')); print('FFmpeg bundled successfully')"

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/SoundCloud Downloader" -DestinationPath "SoundCloud-Downloader-Windows.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: SoundCloud-Downloader-Windows.zip

  build-macos:
    name: Build macOS .app Bundle
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & Package .app Bundle
        run: |
          chmod +x build.sh
          ./build.sh --dist

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: SoundCloud-Downloader-macOS.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Determine Tag
        id: release_tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SoundCloud Downloader ${{ steps.release_tag.outputs.tag }}
          files: |
            SoundCloud-Downloader-Windows.zip
            SoundCloud-Downloader-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
