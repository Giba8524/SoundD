name: Build and Release Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview static-ffmpeg mutagen yt-dlp

      - name: Build Standalone Windows Executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed `
            --name "SoundCloud Downloader" `
            --add-data "static;static" `
            --add-data "icon.ico;." `
            --icon "icon.ico" `
            app_windows.py

      - name: Bundle Static FFmpeg Executable
        shell: pwsh
        run: |
          python -c "import static_ffmpeg, shutil, os; f, p = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); dest = os.path.join('dist', 'SoundCloud Downloader'); shutil.copy(f, os.path.join(dest, 'ffmpeg.exe')); shutil.copy(p, os.path.join(dest, 'ffprobe.exe')); print('FFmpeg bundled successfully')"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Compile Inno Setup Windows Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Copy-Item "dist_installer\SoundCloud-Downloader-Setup.exe" -Destination "SoundCloud-Downloader-Setup.exe"

      - name: Package Windows Portable Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/SoundCloud Downloader" -DestinationPath "SoundCloud-Downloader-Windows-Portable.zip" -Force
          Copy-Item "SoundCloud-Downloader-Windows-Portable.zip" -Destination "SoundCloud-Downloader-Windows.zip"

      - name: Determine Tag
        id: release_tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF.Replace("refs/tags/", "")
          } else {
            $tag = "v1.1.0"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish Windows Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SoundCloud Downloader ${{ steps.release_tag.outputs.tag }}
          files: |
            SoundCloud-Downloader-Setup.exe
            SoundCloud-Downloader-Windows-Portable.zip
            SoundCloud-Downloader-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS .app Bundle
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & Package .app Bundle
        run: |
          chmod +x build.sh
          ./build.sh --dist

      - name: Determine Tag
        id: release_tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish macOS Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SoundCloud Downloader ${{ steps.release_tag.outputs.tag }}
          files: |
            SoundCloud-Downloader-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
